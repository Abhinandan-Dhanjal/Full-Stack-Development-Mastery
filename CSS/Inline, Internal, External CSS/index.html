<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Internal External CSS</title>
    <link rel="stylesheet" href="style.css">
    <style>
     h3{
        background-color: tomato;
        color:papayawhip;
     }   
    </style>
</head>
<body>
<h1>Three ways to add css to html:-</h1>  
 <ol>
 <li>Inline CSS.</li>
 <li>Internal CSS.</li>
 <li>External CSS.</li>
 </ol>
<h2 style="background-color: yellow; color:royalblue">This is the Inline CSS</h2>
<h3>This is the Internal CSS</h3>
<h4>This is the External CSS</h4>
</body>
</html>
