<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Id & Classes</title>
</head>
<body>
<h1>ID :- Id is a unique & it represents by #.</h1> 

<div id="identity" class="identity">First</div>

<h1>Class :- Class is a multiple & it represents by .</h1>

<div class="class">Second</div>
<span class="class">Third</span>
</body>
</html>
