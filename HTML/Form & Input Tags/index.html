<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form & Input Tags</title>
</head>
<body>

<h1 style="text-align:center;">Form In HTML</h1>  
<form>
<label for="textfield">Textfield</label>
<input type="text" id="textfield" name="textfield" placeholder=" Enter Your Textfield">    
<br><br>
<label for="dob">Enter Date</label>
<input type="date" id="dob" name="dob">
<br><br>
<label for="">Choose Gender:</label>
<label for="male">Male</label>
<input type="radio" id="male" name="gender" value="male"> 
<label for="female">Female</label>
<input type="radio" id="female" name="gender" value="female">
<label for="prefer for not to say">Prefer for not to say</label>
<input type="radio" id="prefer for not to say" name="gender">
<br><br>
<label for="">Choose Language:</label>
<label for="english">English</label>
<input type="checkbox" id="english" name="english" value="yes">
<label for="hindi">Hindi</label>
<input type="checkbox" id="hindi" name="hindi" value="yes">  
<br><br>
<label for="">Select Your City:</label>
<select>
<option>Delhi</option>
<option>Mumbai</option> 
<option>Pune</option>  
<option>Bangalore</option>
<option>Gurgaon</option>
</select>
<br><br>
<label for="fileselect">Upload</label>
<input type="file">
<br><br>
<img src="down arrow.png" height="70" width="60">
<br><br>
<label for="password">Enter Password</label>
<input type="password" id="password">
<br><br>
<button>Submit</button> 
</form>
</body>
</html>
